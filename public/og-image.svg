<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111115" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Outer frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Logo Mark -->
  <g transform="translate(100, 100)">
    <rect width="80" height="80" rx="20" fill="#16161D" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
    <path d="M12 40 L24 40 L30 24 L38 56 L46 16 L54 62 L62 30 L68 44 L74 40 L82 40" fill="none" stroke="url(#accent)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Title & Badge -->
  <g transform="translate(205, 125)">
    <text font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="38" fill="#FFFFFF" letter-spacing="-0.5">PulseDeck</text>
    <rect x="200" y="-28" width="80" height="32" rx="8" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.4)" stroke-width="1.5" />
    <text x="240" y="-7" font-family="monospace" font-weight="700" font-size="14" fill="#34D399" text-anchor="middle">v3.0.0</text>
  </g>

  <!-- Tagline -->
  <text x="100" y="270" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="54" fill="#FFFFFF" letter-spacing="-1.5">
    Next-Gen DevOps SRE Command Center
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="340" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="24" fill="#94A3B8">
    Unified real-time telemetry for Cloudflare Edge CDN, GitHub CI/CD, and Gemini AI.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="280" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5" />
    <text x="140" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#34D399" text-anchor="middle">⚡ Cloudflare Edge Metrics</text>

    <rect x="300" y="0" width="280" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(99,102,241,0.3)" stroke-width="1.5" />
    <text x="440" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#818CF8" text-anchor="middle">🐙 GitHub Actions CI/CD</text>

    <rect x="600" y="0" width="280" height="52" rx="14" fill="rgba(255,255,255,0.05)" stroke="rgba(14,165,233,0.3)" stroke-width="1.5" />
    <text x="740" y="32" font-family="monospace" font-size="15" font-weight="700" fill="#38BDF8" text-anchor="middle">🤖 Gemini AI Diagnostics</text>

    <rect x="900" y="0" width="160" height="52" rx="14" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.6)" stroke-width="1.5" />
    <text x="980" y="32" font-family="monospace" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">Self-Hosted</text>
  </g>

  <!-- URL footer -->
  <text x="100" y="540" font-family="monospace" font-size="16" fill="#64748B">https://pulsedeck.dev • 100% Private • Single License (£50)</text>
</svg>
